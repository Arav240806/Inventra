<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suppliers — Inventra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="dash-body">

<div class="dash-shell">
  <div id="sidebarPlaceholder"></div>

  <div class="dash-main">
    <div id="topbarPlaceholder"></div>

    <main class="dash-content">

      <div class="page-toolbar">
        <p class="page-sub">Everyone you source products from.</p>
      </div>

      <div class="form-banner" id="pageBanner" hidden></div>

      <nav class="subtabs" role="tablist">
        <button class="subtab-btn active" id="tabBtnView" data-tab="view">View all</button>
        <button class="subtab-btn" id="tabBtnAdd" data-tab="add">Add</button>
        <button class="subtab-btn" id="tabBtnSearch" data-tab="search">Search</button>
        <button class="subtab-btn" id="tabBtnDelete" data-tab="delete">Delete</button>
      </nav>

      <!-- View all -->
      <section class="subtab-panel" data-panel="view">
        <section class="panel panel-table">
          <table class="data-table">
            <thead>
              <tr>
                <th>Supplier</th>
                <th>Company</th>
                <th>Email</th>
                <th>Contact</th>
                <th>City</th>
                <th>GST Number</th>
                <th>Address</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="suppliersBody">
              <tr><td colspan="8">Loading suppliers...</td></tr>
            </tbody>
          </table>
        </section>
      </section>

      <!-- Add / Edit -->
      <section class="subtab-panel" data-panel="add" hidden>
        <section class="panel">
          <h3 class="subtab-panel-title" id="addPanelTitle">Add supplier</h3>

          <div class="form-banner" id="formBanner" hidden></div>

          <form id="supplierForm" novalidate>
            <input type="hidden" id="supplierId" name="supplierId">

            <div class="form-row">
              <div class="field">
                <label for="supplierName">Supplier name</label>
                <input type="text" id="supplierName" name="supplierName" required>
                <span class="field-error" id="err-supplierName"></span>
              </div>
              <div class="field">
                <label for="companyName">Company name</label>
                <input type="text" id="companyName" name="companyName" required>
                <span class="field-error" id="err-companyName"></span>
              </div>
            </div>

            <div class="form-row">
              <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
                <span class="field-error" id="err-email"></span>
              </div>
              <div class="field">
                <label for="contactNumber">Contact number</label>
                <input type="tel" id="contactNumber" name="contactNumber" maxlength="10" required>
                <span class="field-error" id="err-contactNumber"></span>
              </div>
            </div>

            <div class="form-row">
              <div class="field">
                <label for="gstNumber">GST number</label>
                <input type="text" id="gstNumber" name="gstNumber" required>
                <span class="field-error" id="err-gstNumber"></span>
              </div>
              <div class="field">
                <label for="city">City</label>
                <input type="text" id="city" name="city" required>
                <span class="field-error" id="err-city"></span>
              </div>
            </div>

            <div class="field">
              <label for="address">Address</label>
              <input type="text" id="address" name="address" required>
              <span class="field-error" id="err-address"></span>
            </div>

            <div class="modal-actions">
              <button type="button" class="btn btn-ghost" id="cancelEditBtn" hidden>Cancel edit</button>
              <button type="submit" class="btn btn-primary" id="formSubmit">Save supplier</button>
            </div>
          </form>
        </section>
      </section>

      <!-- Search -->
      <section class="subtab-panel" data-panel="search" hidden>
        <section class="panel">
          <h3 class="subtab-panel-title">Search for a supplier</h3>
          <div class="search-row">
            <div class="field">
              <input type="text" id="searchInput" placeholder="Search by name, company, or city">
            </div>
            <button class="btn btn-primary" id="searchBtn" type="button">Search</button>
          </div>
        </section>

        <section class="panel panel-table">
          <table class="data-table">
            <thead>
              <tr>
                <th>Supplier</th>
                <th>Company</th>
                <th>Email</th>
                <th>Contact</th>
                <th>City</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="searchBody">
              <tr><td colspan="6">Search above to find a supplier.</td></tr>
            </tbody>
          </table>
        </section>
      </section>

      <!-- Delete -->
      <section class="subtab-panel" data-panel="delete" hidden>
        <section class="panel">
          <h3 class="subtab-panel-title">Delete a supplier</h3>
          <div class="search-row">
            <div class="field">
              <input type="text" id="deleteSearchInput" placeholder="Search by name, company, or city">
            </div>
            <button class="btn btn-primary" id="deleteSearchBtn" type="button">Search</button>
          </div>
        </section>

        <section class="panel panel-table">
          <table class="data-table">
            <thead>
              <tr>
                <th>Supplier</th>
                <th>Company</th>
                <th>City</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="deleteBody">
              <tr><td colspan="4">Loading suppliers...</td></tr>
            </tbody>
          </table>
        </section>
      </section>

    </main>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/layout.js"></script>
<script src="js/suppliers.js"></script>
</body>
</html>
